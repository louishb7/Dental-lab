services:
  postgres:
    image: postgres:16-alpine
    container_name: cadisk-nest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadisk_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadisk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cadisk_nest}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - cadisk_nest_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cadisk_dev} -d ${POSTGRES_DB:-cadisk_nest}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  cadisk_nest_postgres_data:
