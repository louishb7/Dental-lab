<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadista MVP - Gestão de Doutores</title>
    <style>
        /* Estilização básica e pragmática para o MVP */
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #ecf0f1; }
        .btn-delete { background-color: #e74c3c; padding: 5px 10px; font-size: 14px; }
        .btn-delete:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h1>Cadista - MVP</h1>
    
    <h2>Cadastrar Novo Doutor</h2>
    <form id="doctorForm">
        <div class="form-group">
            <label for="name">Nome (Obrigatório)</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label for="clinic">Clínica</label>
            <input type="text" id="clinic">
        </div>
        <div class="form-group">
            <label for="phone">Telefone</label>
            <input type="text" id="phone">
        </div>
        <div class="form-group">
            <label for="notes">Observações</label>
            <textarea id="notes" rows="3"></textarea>
        </div>
        <button type="submit">Salvar Doutor</button>
    </form>

    <h2>Lista de Doutores</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Clínica</th>
                <th>Telefone</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="doctorsTableBody">
            </tbody>
    </table>
</div>

<script>
    /**
     * URL base da nossa API FastAPI rodando localmente.
     * @constant {string}
     */
    const API_URL = "http://localhost:8000/doctors";

    /**
     * Busca todos os doutores na API e renderiza na tabela HTML.
     * É chamada ao carregar a página e após qualquer alteração (criar/deletar).
     */
    async function loadDoctors() {
        try {
            const response = await fetch(API_URL + "/");
            const doctors = await response.json();
            
            const tbody = document.getElementById('doctorsTableBody');
            tbody.innerHTML = ''; // Limpa a tabela atual

            doctors.forEach(doctor => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${doctor.id}</td>
                    <td>${doctor.name}</td>
                    <td>${doctor.clinic || '-'}</td>
                    <td>${doctor.phone || '-'}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteDoctor(${doctor.id})">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Erro ao carregar doutores:", error);
            alert("Falha ao carregar os dados. A API está rodando?");
        }
    }

    /**
     * Envia os dados do formulário via POST para criar um novo Doutor.
     * * @param {Event} event - O evento de submissão do formulário.
     */
    async function createDoctor(event) {
        event.preventDefault(); // Evita que a página recarregue

        // Captura os valores dos inputs
        const doctorData = {
            name: document.getElementById('name').value,
            clinic: document.getElementById('clinic').value,
            phone: document.getElementById('phone').value,
            notes: document.getElementById('notes').value
        };

        try {
            const response = await fetch(API_URL + "/", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(doctorData)
            });

            if (response.ok) {
                document.getElementById('doctorForm').reset(); // Limpa o formulário
                loadDoctors(); // Recarrega a tabela com o novo dado
            } else {
                alert("Erro ao criar doutor. Verifique os dados.");
            }
        } catch (error) {
            console.error("Erro ao criar doutor:", error);
        }
    }

    /**
     * Envia uma requisição DELETE para a API para remover um Doutor específico.
     * * @param {number} id - O identificador único do Doutor a ser excluído.
     */
    async function deleteDoctor(id) {
        if (!confirm("Tem certeza que deseja excluir este doutor? Todos os casos dele serão perdidos.")) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                loadDoctors(); // Recarrega a tabela após a exclusão
            } else {
                alert("Erro ao excluir doutor.");
            }
        } catch (error) {
            console.error("Erro ao excluir doutor:", error);
        }
    }

    // Inicializa a aplicação:
    // 1. Atribui a função de criação ao evento de envio do formulário
    document.getElementById('doctorForm').addEventListener('submit', createDoctor);
    
    // 2. Carrega a lista de doutores assim que o script é lido
    loadDoctors();
</script>

</body>
</html>
