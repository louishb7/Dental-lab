[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadista"
version = "0.1.0"
description = "Sistema web de rastreamento de pedidos para cadista independente"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136.1",
  "uvicorn>=0.47.0",
  "SQLAlchemy>=2.0.49",
  "psycopg2-binary>=2.9.12",
  "pydantic>=2.13.4",
  "python-multipart>=0.0.29",
  "alembic>=1.16.0",
  "python-jose[cryptography]>=3.4.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.28.1",
  "ruff>=0.12.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
